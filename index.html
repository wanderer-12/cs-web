<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>WEB-FPS — 人机对战</title>
    <style>
      /* Only the shell lives here. The HUD injects its own stylesheet at runtime
         (src/ui/styles.ts), because every HUD node is generated by TypeScript. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0b0e14;
      }
      body {
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* The WebGL surface: fixed and viewport-sized so the renderer's aspect
         always matches window.innerWidth/Height. */
      #game {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%;
        touch-action: none; outline: none;
      }
      /* HUD mount point. It must NOT swallow pointer events: the HUD's own
         stylesheet makes its panels opt back in with `.hud-interactive`. */
      #hud-root {
        position: fixed; inset: 0;
        pointer-events: none;
      }
      /* Boot / error curtain, removed by src/main.ts on the first frame. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: #0b0e14; color: #cfd6e4;
        font-size: 13px; letter-spacing: .12em;
        transition: opacity .25s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .err {
        max-width: 660px; padding: 0 24px; line-height: 1.7;
        letter-spacing: .02em; color: #ff8f8f; text-align: center;
      }
      #boot .err code { color: #ffd479; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud-root"></div>
    <div id="boot">正在加载…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
